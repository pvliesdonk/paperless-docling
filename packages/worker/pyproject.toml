[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-docling-worker"
version = "0.1.0"
description = "Durable summary worker for Paperless-ngx"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Peter van Liesdonk" },
]
dependencies = [
  "fastapi>=0.116",
  "prometheus-client>=0.22",
  "pydantic>=2.11",
  "uvicorn>=0.35",
]
