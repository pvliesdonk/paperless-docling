[project]
name = "paperless-docling-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2.13.0",
  "paperless-docling-worker",
  "pytest>=9",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
paperless-docling-worker = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["packages/parser/src", "packages/worker/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
